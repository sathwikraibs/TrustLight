# Temporary helper for the build-tools upgrade (Vite 8, Tailwind 4). Deleted after the upgrade.
name: Upgrade helper
on:
  push:
    branches: [build-upgrade]
permissions:
  contents: write
jobs:
  compare:
    if: "!contains(github.event.head_commit.message, 'screenshots')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Build the live version (main)
        run: |
          git worktree add /tmp/main origin/main
          cd /tmp/main/staysafe-full/frontend && npm install --no-audit --no-fund && npm run build && cp -r dist /tmp/old
      - name: Build the upgraded version, audit
        working-directory: staysafe-full/frontend
        run: |
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.app.json --noEmit && npm run build 2>&1 | tail -15 && node scripts/check-page.mjs
          npm audit --json > /tmp/audit.json || true
          node -e 'const a=require("/tmp/audit.json");const v=Object.entries(a.vulnerabilities||{});console.log(`::warning::AUDIT-COUNT ${v.length}`);for(const [n,x] of v)console.log(`::warning::AUDIT ${x.severity} ${n} ${x.range}`)'
          echo "::warning::SIZES old=$(du -sk /tmp/old/assets | cut -f1)KB new=$(du -sk dist/assets | cut -f1)KB"
      - name: Screenshots
        working-directory: staysafe-full/frontend
        run: |
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null)
          rm -rf ../../upgrade-shots
          NODE_PATH=/tmp/pw/node_modules node scripts/shots.mjs /tmp/old ../../upgrade-shots/old
          NODE_PATH=/tmp/pw/node_modules node scripts/shots.mjs dist ../../upgrade-shots/new intro
      - name: Save screenshots on this branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"; git config user.name "github-actions[bot]"
          git add -A upgrade-shots && git commit -qm "Upgrade helper: screenshots" && git push origin HEAD:build-upgrade
