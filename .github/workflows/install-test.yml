# Temporary: tests the install flow in a phone browser. Deleted afterwards.
name: Install flow test
on:
  push:
    branches: [install-test]
permissions:
  contents: write
jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'screenshots')"
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: staysafe-full/frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm install --no-audit --no-fund && npx tsc -p tsconfig.app.json --noEmit && npm run build && node scripts/check-page.mjs
      - run: |
          mkdir -p /tmp/pw && (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright >/dev/null && npx playwright install --with-deps chromium >/dev/null)
          PW_DIR=/tmp/pw node scripts/install-shots.mjs
      - run: |
          cd ../.. && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" && git config user.name "github-actions[bot]"
          git add -A install-shots && git commit -qm "Install test screenshots" && git push origin HEAD:install-test
